name: speedtest-mqtt

services:
  speedtest-mqtt:
    build: .
    image: speedtest-mqtt:latest
    container_name: speedtest-mqtt
    restart: unless-stopped
    # Credentials come from .env (copy .env.example). Never commit .env.
    environment:
      - MQTT_BROKER=${MQTT_BROKER:?set MQTT_BROKER in .env}
      - MQTT_PORT=${MQTT_PORT:-1883}
      - MQTT_USER=${MQTT_USER:-}
      - MQTT_PASSWORD=${MQTT_PASSWORD:-}
      - MQTT_TOPIC_PREFIX=${MQTT_TOPIC_PREFIX:-speedtest}
      - TEST_INTERVAL=${TEST_INTERVAL:-3600}
    # Default bridge networking is fine for most setups. If you need the
    # container to have its own LAN address (and so use the host's 2.5GbE NIC
    # directly), use macvlan, e.g.:
    #
    #   networks:
    #     lan:
    #       ipv4_address: 192.168.1.160
    #
    # networks:
    #   lan:
    #     driver: macvlan
    #     driver_opts:
    #       parent: eth0        # your 2.5GbE interface
    #     ipam:
    #       config:
    #         - subnet: 192.168.1.0/24
    #           gateway: 192.168.1.1
    #           ip_range: 192.168.1.160/32
    #
    # Note: a macvlan container cannot reach its own host.
